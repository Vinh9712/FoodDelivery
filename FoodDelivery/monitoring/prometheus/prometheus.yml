# =====================================================================
# Prometheus scrape configuration for FoodDelivery platform.
#
# All Spring Boot services expose metrics at /actuator/prometheus
# (enabled in shared config-server/config/application.yaml).
#
# When running via docker compose, use container names as hostnames.
# When running locally, use localhost with each service's port.
# =====================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local'

rule_files: []

scrape_configs:

  # ── API Gateway ──────────────────────────────────────────────────────
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'

  # ── Eureka Server ────────────────────────────────────────────────────
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']
        labels:
          service: 'eureka-server'

  # ── Business Services ────────────────────────────────────────────────
  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer-service:8081']
        labels:
          service: 'customer-service'

  - job_name: 'restaurant-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['restaurant-service:8082']
        labels:
          service: 'restaurant-service'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8083']
        labels:
          service: 'order-service'

  - job_name: 'delivery-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['delivery-service:8084']
        labels:
          service: 'delivery-service'

  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8085']
        labels:
          service: 'payment-service'

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8086']
        labels:
          service: 'notification-service'

  # ── Prometheus self-monitoring ───────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
