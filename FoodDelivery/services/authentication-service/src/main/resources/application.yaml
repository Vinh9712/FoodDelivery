spring:
  application:
    name: authentication-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

app:
  jwt:
    issuer: ${JWT_ISSUER:food-delivery-auth}
    audience: ${JWT_AUDIENCE:food-delivery-api}
    key-id: ${JWT_KEY_ID:food-delivery-auth-1}
    private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
