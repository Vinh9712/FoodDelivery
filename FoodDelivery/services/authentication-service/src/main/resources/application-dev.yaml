spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8087

app:
  jwt:
    secret: 135791234567892468helloworldantisercet135791234567892468helloworldantisercet135791234567892468helloworldantisercet
    expiration-ms: 86400000
  kafka:
    enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    com.fooddelivery: DEBUG
