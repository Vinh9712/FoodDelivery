# Customer Service – local dev overrides.
# Activate with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# DataSource / Kafka / JWT secret are NOT redefined here: they come from
# Config Server + environment variables (DB_USER, DB_PASSWORD, JWT_SECRET).
# This profile only turns on verbose SQL/logging for debugging.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fooddelivery.customer: DEBUG
    org.springframework.security: DEBUG
