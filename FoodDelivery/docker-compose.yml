# =====================================================================
# Full local stack for the FoodDelivery platform.
#
#   1. cp .env.example .env   (then edit the credentials)
#   2. docker compose up --build
#
# Boot order is enforced via healthchecks:
#   postgres + kafka + keycloak  ->  eureka + config-server  ->  services + gateway
#
# Ports (host:container):
#   8080 api-gateway   8081 customer   8082 restaurant   8083 order
#   8084 delivery      8085 payment    8086 notification
#   8761 eureka        8888 config-server
#   5432 postgres      9092 kafka      8090 kafka-ui      8180 keycloak
# =====================================================================

name: fooddelivery

# Reusable fragments 
x-maven-build: &maven-build
  context: .
  dockerfile: Dockerfile

x-app-base: &app-base
  restart: unless-stopped
  networks: [backend]

x-discovery-env: &discovery-env
  CONFIG_SERVER_URI: http://config-server:8888
  EUREKA_URI: http://eureka-server:8761/eureka/

x-infra-deps: &infra-deps
  config-server:
    condition: service_healthy
  eureka-server:
    condition: service_healthy

# A reusable HTTP healthcheck (the actual URL is set per service via test).
x-actuator-health: &actuator-health
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 60s

services:
  #  Backing services 
  postgres:
    image: postgres:16
    container_name: fd-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  kafka:
    image: apache/kafka:3.8.1
    container_name: fd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [backend]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fd-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fd-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo done"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

  # --- Platform infrastructure (Spring) ---
  eureka-server:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: infra/eureka-server
    container_name: fd-eureka
    ports:
      - "8761:8761"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]

  config-server:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: infra/config-server
    container_name: fd-config-server
    ports:
      - "8888:8888"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]

  api-gateway:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: infra/api-gateway
    container_name: fd-api-gateway
    depends_on:
      <<: *infra-deps
      keycloak:
        condition: service_healthy
    environment:
      <<: *discovery-env
      # NOTE: tokens minted via http://localhost:8180 carry that issuer; if you
      # call the gateway with such a token the issuer will not match this URL.
      # For pure dev you can disable auth with SPRING_PROFILES_ACTIVE=insecure.
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/fooddelivery
    ports:
      - "8080:8080"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]

  # --- Business services ---
  customer-service:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: services/customer-service
    container_name: fd-customer-service
    depends_on:
      <<: *infra-deps
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *discovery-env
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]

  restaurant-service:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: services/restaurant-service
    container_name: fd-restaurant-service
    depends_on:
      <<: *infra-deps
    environment:
      <<: *discovery-env
    ports:
      - "8082:8082"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]

  order-service:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: services/order-service
    container_name: fd-order-service
    depends_on:
      <<: *infra-deps
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *discovery-env
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8083:8083"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]

  delivery-service:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: services/delivery-service
    container_name: fd-delivery-service
    depends_on:
      <<: *infra-deps
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *discovery-env
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8084:8084"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]

  payment-service:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: services/payment-service
    container_name: fd-payment-service
    depends_on:
      <<: *infra-deps
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *discovery-env
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8085:8085"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]

  notification-service:
    <<: *app-base
    build:
      <<: *maven-build
      args:
        MODULE: services/notification-service
    container_name: fd-notification-service
    depends_on:
      <<: *infra-deps
      kafka:
        condition: service_healthy
    environment:
      <<: *discovery-env
      KAFKA_BOOTSTRAP: kafka:9092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8086:8086"
    healthcheck:
      <<: *actuator-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fd-prometheus
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [backend]

  grafana:
    image: grafana/grafana:11.1.4
    container_name: fd-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [backend]

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: fd-zipkin
    ports:
      - "9411:9411"
    networks: [backend]
volumes:
  pgdata:
  grafana-data:

networks:
  backend:
    driver: bridge
