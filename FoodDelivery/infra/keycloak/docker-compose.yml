# Keycloak for local development (identity provider for the gateway's JWT validation).
#
#   docker compose -f infra/keycloak/docker-compose.yml up -d
#
# Admin console:  http://localhost:8180  (admin / admin)
# Issuer URI:     http://localhost:8180/realms/fooddelivery
#
# The 'fooddelivery' realm (with a public client) is auto-imported on first start.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fooddelivery-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo done"]
      interval: 15s
      timeout: 5s
      retries: 10
