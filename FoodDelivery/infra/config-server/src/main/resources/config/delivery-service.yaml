# Delivery Service – overrides on top of the shared application.yaml.
server:
  port: 8084

app:
  delivery:
    outbox:
      relay:
        enabled: ${DELIVERY_OUTBOX_RELAY_ENABLED:true}
        poll-delay: ${DELIVERY_OUTBOX_POLL_DELAY:2s}
        send-timeout: ${DELIVERY_OUTBOX_SEND_TIMEOUT:5s}
        retry-base-delay: ${DELIVERY_OUTBOX_RETRY_BASE_DELAY:5s}
        retry-max-delay: ${DELIVERY_OUTBOX_RETRY_MAX_DELAY:5m}
        max-attempts: ${DELIVERY_OUTBOX_MAX_ATTEMPTS:10}
    assignment:
      retry-enabled: ${DELIVERY_ASSIGNMENT_RETRY_ENABLED:true}
      poll-delay: ${DELIVERY_ASSIGNMENT_POLL_DELAY:5s}
      retry-base-delay: ${DELIVERY_ASSIGNMENT_RETRY_BASE_DELAY:10s}
      retry-max-delay: ${DELIVERY_ASSIGNMENT_RETRY_MAX_DELAY:10m}
      max-attempts: ${DELIVERY_ASSIGNMENT_MAX_ATTEMPTS:10}
    inbox:
      deferred-scan-delay: ${DELIVERY_INBOX_DEFERRED_SCAN_DELAY:15s}
    kafka:
      delivery-events-topic: ${DELIVERY_EVENTS_TOPIC:delivery.events.v1}
      order-events-topic: ${ORDER_EVENTS_TOPIC:order.events.v1}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/food_delivery_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: delivery-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # String payloads for explicit JSON envelope parsing (family topics are raw JSON, no Java type headers)
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
