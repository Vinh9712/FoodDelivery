# API Gateway � route/security overrides on top of the shared application.yaml.
server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # Specific admin ops routes MUST be before auth's /api/v1/admin/** catch-all historically.
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/admin/payments/**
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/deliveries/**,/api/v1/drivers/**,/api/v1/admin/drivers/**,/api/v1/admin/deliveries/**
        - id: authentication-service
          uri: lb://authentication-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/users/**,/api/v1/sessions/**
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/restaurants/**,/api/v1/reviews/**,/api/v1/items/**,/api/v1/categories/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/restaurant-orders/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:5173"
              - "http://localhost:4173"
              - "http://127.0.0.1:4173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
app:
  internal:
    gateway-secret: ${INTERNAL_GATEWAY_SECRET}
  security:
    public-paths: /actuator/health/**,/actuator/info,/api/v1/auth/register,/api/v1/auth/register-driver,/api/v1/auth/register-owner,/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/auth/logout,/api/v1/auth/forgot-password,/api/v1/auth/reset-password

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics, prometheus, refresh
  endpoint:
    gateway:
      access: unrestricted
    refresh:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
