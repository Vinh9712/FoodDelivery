# Payment Service – overrides on top of the shared application.yaml.
server:
  port: 8085

app:
  payment:
    simulator:
      max-amount: ${PAYMENT_SIMULATOR_MAX_AMOUNT:500000}
    outbox:
      relay:
        enabled: ${PAYMENT_OUTBOX_RELAY_ENABLED:true}
        poll-delay: ${PAYMENT_OUTBOX_POLL_DELAY:2s}
        send-timeout: ${PAYMENT_OUTBOX_SEND_TIMEOUT:5s}
        retry-base-delay: ${PAYMENT_OUTBOX_RETRY_BASE_DELAY:5s}
        retry-max-delay: ${PAYMENT_OUTBOX_RETRY_MAX_DELAY:5m}
        max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:10}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.fooddelivery.payment.*,java.util"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
