# Restaurant Service – overrides on top of the shared application.yaml.
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/restaurant_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: restaurant:com.fooddelivery.restaurant.event.RestaurantEvent, menu:com.fooddelivery.restaurant.event.MenuItemEvent

logging:
  level:
    com.fooddelivery.restaurant: ${RESTAURANT_LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:INFO}

app:
  security:
    public-get-paths:
      - /api/v1/restaurants/**
      - /api/v1/items/**
      - /api/v1/categories/**
      - /api/v1/reviews/**
