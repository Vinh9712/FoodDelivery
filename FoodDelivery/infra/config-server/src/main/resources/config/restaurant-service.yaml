# Restaurant Service – overrides on top of the shared application.yaml.
server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/restaurant_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
logging:
  level:
    com.fooddelivery.restaurant: ${RESTAURANT_LOG_LEVEL:INFO}

app:
  restaurant:
    business-zone: ${RESTAURANT_BUSINESS_ZONE:Asia/Ho_Chi_Minh}
  security:
    public-get-paths:
      - /api/v1/restaurants/**
      - /api/v1/items/**
      - /api/v1/categories/**
      - /api/v1/reviews/**
