# Notification Service – overrides on top of the shared application.yaml.
server:
  port: 8086

app:
  notification:
    dispatch:
      enabled: ${NOTIFICATION_DISPATCH_ENABLED:true}
      poll-delay: ${NOTIFICATION_DISPATCH_POLL_DELAY:2s}
      retry-base-delay: ${NOTIFICATION_RETRY_BASE_DELAY:5s}
      retry-max-delay: ${NOTIFICATION_RETRY_MAX_DELAY:10m}
      max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
    kafka:
      order-events-topic: ${ORDER_EVENTS_TOPIC:order.events.v1}
      delivery-events-topic: ${DELIVERY_EVENTS_TOPIC:delivery.events.v1}
      payment-events-topic: ${PAYMENT_EVENTS_TOPIC:payment.events.v1}

spring:
  kafka:
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Family topics publish raw IntegrationEventEnvelope JSON (no Java type headers).
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
