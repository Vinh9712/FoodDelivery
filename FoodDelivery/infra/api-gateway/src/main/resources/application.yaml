server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/customers/**, /api/v1/auth/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: restaurant-service
              uri: http://localhost:8082
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/restaurant/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/order/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: delivery-service
              uri: http://localhost:8084
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/delivery/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/payments/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: notification-service
              uri: http://localhost:8086
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/notifications/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
          globalcors:
            cors-configurations:
              [ /** ]:
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      access: unrestricted
  metrics:
    tags:
      application: api-gateway
  logging:
    level:
      org.springframework.cloud.gateway: DEBUG
