server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Pull shared config from Config Server; 'optional:' => gateway still boots if it is down.
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          # Auto-create routes from Eureka registry as a fallback (lb://<service-id>).
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/v1/customers/**
                - Path=/api/v1/auth/**
                - Path=/api/v1/admin/**
            - id: restaurant-service
              uri: lb://restaurant-service
              predicates:
                - Path=/api/v1/restaurant/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/order/**
            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/delivery/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

  # ── Security: validate JWTs issued by Keycloak ──
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/fooddelivery}

# ── Service Discovery ──
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# ── Gateway security policy (consumed by SecurityConfig) ──
app:
  security:
    # Endpoints reachable WITHOUT a JWT. Everything else requires authentication.
    public-paths:
      - /actuator/health/**
      - /actuator/info
      - /api/v1/customers/register
      - /api/v1/customers/login

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics, prometheus
  endpoint:
    gateway:
      access: unrestricted

logging:
  level:
    org.springframework.cloud.gateway: INFO
