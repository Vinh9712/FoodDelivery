spring:
  config:
    import: ""
  cloud:
    bus:
      enabled: false
    config:
      enabled: false

eureka:
  client:
    enabled: false

app:
  internal:
    gateway-secret: test-gateway-secret
  security:
    public-paths: /actuator/**
    jwt:
      jwk-set-uri: http://localhost:65535/.well-known/jwks.json
      issuer: food-delivery-auth
      audience: food-delivery-api
